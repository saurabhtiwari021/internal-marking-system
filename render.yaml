services:
  - type: web
    name: marking-system-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python init_db.py && uvicorn api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false       
      - key: ETL_API_KEY
        sync: false       
      - key: ENVIRONMENT
        value: production
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: PYTHON_VERSION
        value: "3.11.9"

